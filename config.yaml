# =====================================================================
#  E-COMMERCE AI TEAM - configuration
#  Everything here is FREE. No paid API keys anywhere.
#  Tip: you can change language / GST / category right inside the web app
#       (top of the screen) - no need to edit this file.
# =====================================================================

business:
  name: "My Store"
  # The marketplaces you sell on (India). Add/remove freely.
  channels:
    - "Flipkart"
    - "Amazon"        # Amazon.in
    - "Myntra"
    - "Meesho"
  currency: "INR"
  tone: "friendly, professional, trustworthy"

  # --- India settings -------------------------------------------------
  # Language for listings, captions and replies:
  #   english  | hindi  | hinglish (Hindi + English mix, popular for social)
  language: "english"

  # Your product's GST slab (%). Common slabs: 5, 12, 18, 28.
  # Used by the Pricing agent to show GST and true take-home.
  gst_percent: 18

  # Your MAIN product category - lets the Pricing agent use category-accurate
  # marketplace commissions. Supported keys (others fall back to a default):
  #   apparel | electronics | home_kitchen | beauty | books | toys |
  #   footwear | jewellery | mobile_accessories | general
  category: "apparel"

# ---------------------------------------------------------------------
#  The AI brain. Runs LOCALLY via Ollama = 100% free, no credits.
#  If Ollama is not installed/running, the system automatically falls
#  back to built-in templates so it still works (just less "smart").
# ---------------------------------------------------------------------
llm:
  provider: "ollama"          # only free/local option supported
  host: "http://localhost:11434"
  model: "llama3.2"           # any free model you have pulled, e.g. llama3.2, qwen2.5, mistral
  temperature: 0.7
  timeout_seconds: 120
  fallback_to_templates: true # keep true so it never fully breaks
