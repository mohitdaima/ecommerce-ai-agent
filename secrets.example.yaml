# =====================================================================
#  PRIVATE marketplace API keys.
#  1) Copy this file to  secrets.yaml
#  2) Fill in ONLY the marketplaces you have API access for.
#  3) secrets.yaml is git-ignored - your keys stay on your PC.
#
#  Leave a marketplace blank/removed and it runs in safe mode:
#    - Amazon / Flipkart  -> dry-run (shows what it would post)
#    - Myntra/Meesho/Ajio -> generates a bulk-upload catalog file for you
# =====================================================================

# --- Amazon.in (Selling Partner API / SP-API) -----------------------
# How to get these (free, needs Professional seller account):
#   https://developer-docs.amazon.com/sp-api/docs/registering-your-application
Amazon:
  refresh_token: ""      # LWA refresh token from your SP-API app
  client_id: ""          # LWA client id (amzn1.application-oa2-client...)
  client_secret: ""      # LWA client secret
  seller_id: ""          # your Amazon seller/merchant id
  marketplace_id: "A21TJRUUN4KGV"   # A21TJRUUN4KGV = Amazon.in
  region_host: "https://sellingpartnerapi-eu.amazon.com"  # India = EU endpoint

# --- Flipkart Marketplace API ---------------------------------------
# How to get these (free, needs approved seller account):
#   https://seller.flipkart.com/api-docs/FMSAPI.html
Flipkart:
  app_id: ""             # Flipkart application id
  app_secret: ""         # Flipkart application secret

# Myntra, Meesho and Ajio do NOT offer a public developer API.
# The app generates a bulk-catalog CSV you upload in their seller panels,
# so no keys are needed here.
